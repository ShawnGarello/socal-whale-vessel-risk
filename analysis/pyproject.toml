[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "socal-whale-vessel-analysis"
version = "0.1.0"
description = "Offline processing foundation for Southern California whale-vessel overlap analysis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.5.5,<2",
    "pyarrow>=25,<26",
    "pyogrio>=0.13,<0.14",
    "pyproj>=3.7.2,<4",
    "shapely>=2.1.2,<3",
]

[project.scripts]
whale-vessel-analysis = "whale_vessel_analysis.cli:main"
whale-vessel-grid = "whale_vessel_analysis.spatial_cli:main"
whale-vessel-whale-grid = "whale_vessel_analysis.whale_grid_cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.13,<0.14",
]
benchmark = [
    "polars>=1.44.1,<2",
    "psutil>=7.2.2,<8",
    "types-psutil>=7.2.2,<8",
]

[tool.uv]
default-groups = ["dev", "benchmark"]

[tool.hatch.build.targets.wheel]
packages = ["src/whale_vessel_analysis"]

[tool.hatch.build.targets.wheel.force-include]
"src/whale_vessel_analysis/default_config.toml" = "whale_vessel_analysis/default_config.toml"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/whale_vessel_analysis"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pyogrio", "pyogrio.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
